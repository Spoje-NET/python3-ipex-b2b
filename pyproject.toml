[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipex-b2b"
version = "0.1.0"
description = "Python client library for the IPEX B2B REST API (restapi.ipex.cz)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vítězslav Dvořák", email = "info@vitexsoftware.cz" }]
dependencies = ["requests"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Communications :: Telephony",
]

[project.urls]
Homepage = "https://github.com/Spoje-NET/python3-ipex-b2b"

[tool.hatch.build.targets.wheel]
packages = ["ipexb2b"]

[tool.pytest.ini_options]
testpaths = ["tests"]
